<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pênaltis CardBol</title>
  <meta name="theme-color" content="#04100d">
  <link rel="stylesheet" href="penalty.css">
</head>
<body>
  <main class="penalty-app" id="penaltyApp">
    <div class="scene-viewport" id="sceneViewport" aria-label="Pênaltis CardBol">
      <div class="scene-canvas" id="sceneCanvas">
        <img class="scene-bg" src="../imagens/mini-game-penalty/fundo5.png" alt="Estádio CardBol com gol ao centro">

        <div class="goal-targets" id="goalTargets" aria-label="Escolha onde chutar">
          <button type="button" class="target-zone" data-zone="0" aria-label="Alto à esquerda"><span></span></button>
          <button type="button" class="target-zone" data-zone="1" aria-label="Alto ao centro"><span></span></button>
          <button type="button" class="target-zone" data-zone="2" aria-label="Alto à direita"><span></span></button>
          <button type="button" class="target-zone" data-zone="3" aria-label="Embaixo à esquerda"><span></span></button>
          <button type="button" class="target-zone" data-zone="4" aria-label="Embaixo ao centro"><span></span></button>
          <button type="button" class="target-zone" data-zone="5" aria-label="Embaixo à direita"><span></span></button>
        </div>

        <div class="keeper-shadow" id="keeperShadow" aria-hidden="true"></div>
        <div class="keeper-box" id="keeperBox" aria-hidden="true">
          <img id="penaltyGoalkeeper" src="../imagens/mini-game-penalty/1goleiro-parado.png" alt="Goleiro">
        </div>

        <div class="ball-shadow" id="ballShadow" aria-hidden="true"></div>
        <img id="penaltyBall" class="penalty-ball" src="../imagens/mini-game-penalty/bola.png" alt="Bola CardBol">
      </div>
    </div>

    <header class="game-hud">
      <button type="button" class="hud-btn" id="penaltyBackButton">‹ CENTRAL DE JOGOS</button>
      <div class="hud-title">
        <small>CARDBOL • MINI GAME</small>
        <strong>PÊNALTIS CARDBOL</strong>
      </div>
      <div class="hud-score" id="penaltyTestScore">GOLS 0 • DEFESAS 0</div>
    </header>

    <section class="shot-hud" id="shotHud">
      <div class="shot-title" id="shotTitle">ESCOLHA O CANTO</div>
      <div class="shot-instruction" id="penaltyInstruction">Toque em um dos 6 alvos do gol.</div>
      <button type="button" class="again-btn" id="penaltyAgainButton" hidden>COBRAR NOVAMENTE</button>
    </section>

    <div class="penalty-result" id="penaltyResult" aria-live="polite"></div>
  </main>

  <script src="penalty.js"></script>
</body>
</html>
